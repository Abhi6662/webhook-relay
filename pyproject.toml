[tool.poetry]
name = "webhook-relay"
version = "0.1.0"
description = "FastAPI webhook ingestion with HMAC verification and SQLite queue"
authors = ["Abhishek Mandloi <163866821+Abhi6662@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "webhook_relay", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
